document_schema_version: '1.0'
execution_authority: python
status: active
contract_builder_entry: pipeline.contract_builders:ExecutableContractBuilder.build
transformation_entry: pipeline.agents.refactoring_providers:ExistingLLMRefactoringProvider.generate
prompt_entry: pipeline.agents.prompt_service:RefactoringPromptService.build
contract_id: ar.grounded_message
issue_type: Assertion_Roulette
version: '4.1'
scope: general
applicability_entry: pipeline.agents.safety_contracts:analyze
validator_entry: pipeline.agents.candidate_validation:validate_assertion_roulette
contract_file: assertion_roulette/contract.yaml
prompt_file: assertion_roulette/prompt.md
rules:
  applicability_prerequisites: Jupiter assertion API 必须可证明绑定，拒绝遮蔽、未知继承/接收者和重载歧义；按 overload 区分已有消息与缺失消息，delta
    等不支持形式不扩大准入。至少两个 assertion 且有缺失消息；单 assertion 为 SKIP_FALSE_POSITIVE。每个缺失消息（含嵌套调用）单独绑定 assertion identity、AST
    path、parent 和参数范围。
  transformation_target: '每个批准 assertion 的最后参数插入一个普通字符串；grounded_message = json.dumps("Check failed: "
    + call["code"].strip(), ensure_ascii=False)。这是原始断言源码引用，不推断业务含义。'
  edit_and_preservation_constraints: 仅 ADD_ASSERTION_MESSAGE；预期值、实际值、所有非消息参数、API/receiver、assertion 数量/顺序/父子嵌套、原有消息和非断言代码受保护。禁止
    supplier、函数调用、拼接、状态读取及引入副作用；不得把消息插到 expected/actual 前面。
  candidate_validation_predicates: verify_proof 和原始方法一致性；assertion 数量、顺序、identity、parent 一致；target 恰好多一个最后普通字符串；遮蔽嵌套
    assertion 后非消息参数相同；非 target 调用及 assertion 外代码相同。message diagnostic 要求解码后等于 grounded_message，否则产生 UNVERIFIED_DIAGNOSTIC_CLAIM
    等失败。不是任意自然语言“有意义”即可。
  allowed_edits:
    source_field: transformation_target
  forbidden_edits:
    source_field: edit_and_preservation_constraints
  protected_elements:
    source_field: edit_and_preservation_constraints
  required_preservation:
    source_field: edit_and_preservation_constraints
common_pipeline_requirements: 'ApplicabilityEvidenceExtractor → 默认 instance-level ApplicabilityPolicy
  / RuleBasedRiskAssessor + RiskPolicyGuard → REFACTOR_LOW_RISK → RISK_APPROVED → ExecutableContractBuilder
  → RefactoringPromptService → CandidateValidator → file composition → compile/test → revalidation → EvidenceLinkedAcceptancePolicy。


  ContractBuilder 还检查 risk envelope、instance ID、单目标 smell、有效来源证据、source/method/hash/line range 和当前文件绑定；低风险不是最终接纳。验证、拼接、编译测试、复检和
  final acceptance 未被 Prompt 或 registry 替代。


  instance_schema_version=2.0 与 source_schema_version 独立；refactoring_contract.contract_id/version 是六条规则的登记身份。ECT
  dispatcher proof 版本 3.0 与 fail/flag/no_throw 路径版本 1.0/2.0/1.0 不应混为一个 schema 版本。Prompt service 版本 5.2-contract-v4.1-ect-v3，CandidateValidator
  4.2；RA catch 内部另有 ra-v2-local-deletion-1。版本号差异本身不表示未同步。


  共同 CandidateValidator 检查单个完整方法、非空、无 class/import 等外层内容、签名/annotation、原文件 hash、方法未删、无新增 placeholder、存在变化；调用
  smell predicate 后只替换目标方法并核对方法外内容。单个 Java Markdown fence 会先清理，INFO 不阻止通过。候选通过仅表示静态阶段通过。'
ect_common_restrictions: null

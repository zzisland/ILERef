transformation_entry: pipeline.agents.refactoring_providers:ExistingLLMRefactoringProvider.generate
prompt_entry: pipeline.agents.prompt_service:RefactoringPromptService.build
contract_id: ect.must_throw.fail
issue_type: Exception_Catching_Throwing
version: '1.0'
scope: general
applicability_entry: pipeline.agents.safety_contracts:analyze_ect
validator_entry: pipeline.agents.candidate_validation:validate_exception_refactoring
contract_file: exception_catching_throwing/must_throw/fail/contract.yaml
prompt_file: exception_catching_throwing/must_throw/fail/prompt.md
rules:
  applicability_prerequisites: 顶层唯一普通 try、一个 catch、无 finally/resources/multi-catch；catch 为空。try 恰为完整调用/构造表达式后跟
    fail，可带一个普通字符串消息。拒绝 Throwable/Error/AssertionError 等可吞 fail 类型。仅已知 java.lang Exception 子集，短名要求显式 java.lang
    import 并排除遮蔽；未知层级 REVIEW。触发表达式无赋值、自增、lambda/匿名类；方法其他写入导致 capture 未知 REVIEW。
  transformation_target: 替换整个批准 try/catch 范围为 assertThrows(ExceptionType.class, () -> completeTrigger[,
    originalFailureMessage]);。
  edit_and_preservation_constraints: 保留异常类型、完整调用链与参数、一次执行及时序、字面量 fail 消息、区域外 setup/verify/assertion。无
    flag 可删除；不得猜测更窄 throw site，不增 imports/helper/catch/finally/resource。准入失败不是自动转成宽松规则。
  candidate_validation_predicates: verify_proof；按 target.replacement 重放；expected AST 与候选相同，允许新单表达式 lambda
    的 expression/block 等价规范化。TRIGGER_BOUNDARY_UNCHANGED 与 EXACT_EXCEPTION_REGION 使用同一个完整结果。v1 不做独立 comment_inventory
    对比，新增注释探针通过。Prompt 的 flag 段错配已由 ect-fail-prompt-fix-1 修正；validator 不变。
  allowed_edits:
    source_field: transformation_target
  forbidden_edits:
    source_field: edit_and_preservation_constraints
  protected_elements:
    source_field: edit_and_preservation_constraints
  required_preservation:
    source_field: edit_and_preservation_constraints
common_pipeline_requirements: 'ApplicabilityEvidenceExtractor → 默认 instance-level ApplicabilityPolicy
  / RuleBasedRiskAssessor + RiskPolicyGuard → REFACTOR_LOW_RISK → RISK_APPROVED → ExecutableContractBuilder
  → RefactoringPromptService → CandidateValidator → file composition → compile/test → revalidation → EvidenceLinkedAcceptancePolicy。


  ContractBuilder 还检查 risk envelope、instance ID、单目标 smell、有效来源证据、source/method/hash/line range 和当前文件绑定；低风险不是最终接纳。验证、拼接、编译测试、复检和
  final acceptance 未被 Prompt 或 registry 替代。


  instance_schema_version=2.0 与 source_schema_version 独立；refactoring_contract.contract_id/version 是六条规则的登记身份。ECT
  dispatcher proof 版本 3.0 与 fail/flag/no_throw 路径版本 1.0/2.0/1.0 不应混为一个 schema 版本。Prompt service 版本 5.2-contract-v4.1-ect-v3，CandidateValidator
  4.2；RA catch 内部另有 ra-v2-local-deletion-1。版本号差异本身不表示未同步。


  共同 CandidateValidator 检查单个完整方法、非空、无 class/import 等外层内容、签名/annotation、原文件 hash、方法未删、无新增 placeholder、存在变化；调用
  smell predicate 后只替换目标方法并核对方法外内容。单个 Java Markdown fence 会先清理，INFO 不阻止通过。候选通过仅表示静态阶段通过。'
ect_common_restrictions: 'multiple try → ECT_MULTIPLE_TARGETS_UNSUPPORTED；多 catch / finally / try-with-resources
  → ECT_CATCH_OR_RESOURCE_BOUNDARY_UNSUPPORTED；嵌套控制 → ECT_NESTED_CONTROL_FLOW_UNSUPPORTED；union catch
  → ECT_MULTICATCH_UNSUPPORTED；可能捕获 fail 的 Error 类 → ECT_CATCH_CAN_CAPTURE_FAIL。无 try 时有 throws 才进入 no_throw；显式
  throw 或无目标分别 SKIP_NOT_APPLICABLE / SKIP_FALSE_POSITIVE。review/skip 不等价于扩大支持。


  flag marker 当前只接受 assertTrue(flag)、assertEquals(true, flag)、assertEquals(flag, true)，且都需要 API 绑定，不含额外
  message 参数。catch 的 cause local 只允许 Throwable/java.lang.Throwable 的单变量 ex.getCause() 初始化；observation
  assertion 需引用 ex 或该 cause local，嵌套调用仅允许以下白名单、且 receiver 关联该异常根；禁止赋值/更新/构造/lambda/匿名类。


  ECT_V2_ASSERTIONS：assertEquals、assertNotEquals、assertTrue、assertFalse、assertNull、assertNotNull、assertSame、assertNotSame、assertArrayEquals、assertInstanceOf。


  ECT_V2_OBSERVATION_METHODS：getMessage、getLocalizedMessage、getCause、getSuppressed、getClass、contains、startsWith、endsWith、equals、isEmpty、length、toString。


  fail1 safe_types：Exception、RuntimeException、IllegalArgumentException、IllegalStateException、NullPointerException、IndexOutOfBoundsException、UnsupportedOperationException、NumberFormatException（需前述
  java.lang 绑定证明）。flag2 使用独立异常类型证据解析，不能将 fail1 的有限类型表套用为 flag2 完整支持范围。'
